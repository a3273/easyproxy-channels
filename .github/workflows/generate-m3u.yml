name: Generate M3U Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Create output directory
        run: mkdir -p output

      - name: Generate M3U
        env:
          EASYPROXY_BASE: ${{ secrets.EASYPROXY_BASE }}
        run: python generate_m3u.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/ status.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update playlist [skip ci]"
          git pull --rebase
          git push

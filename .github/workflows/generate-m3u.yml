name: Generate M3U Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Create output directory
        run: mkdir -p output

      - name: Clear Python cache
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true

      - name: Generate M3U
        env:
          EASYPROXY_BASE: ${{ secrets.EASYPROXY_BASE }}
        run: python -B generate_m3u.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Debug: mostra cosa esiste
          echo "=== File in directory ==="
          ls -la
          echo "=== File in output/ ==="
          ls -la output/ 2>/dev/null || echo "output/ non esiste"
          
          # Forza add dei file generati
          git add -f playlist.m3u status.json output/ 2>/dev/null || true
          
          # Debug: mostra cosa è staged
          echo "=== Staged files ==="
          git diff --staged --name-only
          
          # Commit e push
          git diff --staged --quiet || git commit -m "Update playlist [skip ci]"
          git pull --rebase --autostash || true
          git push || (git pull --rebase --autostash && git push)

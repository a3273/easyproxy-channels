name: Generate M3U Playlist

on:
  schedule:
    # Ogni 30 minuti
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Permette di lanciarlo manualmente
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Scarica il codice del repo
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Installa Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # 3. Installa dipendenze
      - name: Install dependencies
        run: |
          pip install requests
      
      # 4. Genera la playlist
      - name: Generate M3U
        run: |
          python generate_m3u.py
      
      # 5. Committa e pusha i risultati
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/
          git add status.json
          git diff --staged --quiet || git commit -m "Update playlist [skip ci]"
          git push

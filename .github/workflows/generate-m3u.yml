name: Generate M3U

on:
  push:
    paths:
      - "channels.json"
      - "generate_m3u.py"
      - "providers/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate playlist
        run: python generate_m3u.py

      - name: Commit playlist
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update playlist.m3u"
          file_pattern: playlist.m3u
